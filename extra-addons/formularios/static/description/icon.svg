<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#2d1b69"/>
  <!-- Clipboard body -->
  <rect x="20" y="24" width="60" height="66" rx="5" fill="#7c3aed"/>
  <!-- Clipboard clip -->
  <rect x="34" y="16" width="32" height="16" rx="8" fill="#5b21b6"/>
  <rect x="40" y="19" width="20" height="10" rx="5" fill="#4c1d95"/>
  <!-- Field 1 - checkbox + line -->
  <rect x="30" y="42" width="12" height="10" rx="2" fill="#a78bfa" opacity="0.4"/>
  <line x1="30" y1="42" x2="42" y2="42" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="30" y1="52" x2="42" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="30" y1="42" x2="30" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="42" y1="42" x2="42" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="46" y1="47" x2="66" y2="47" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Field 2 -->
  <rect x="30" y="57" width="12" height="10" rx="2" fill="#a78bfa" opacity="0.4"/>
  <line x1="30" y1="57" x2="42" y2="57" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="30" y1="67" x2="42" y2="67" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="30" y1="57" x2="30" y2="67" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="42" y1="57" x2="42" y2="67" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="46" y1="62" x2="66" y2="62" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Field 3 checked -->
  <rect x="30" y="72" width="12" height="10" rx="2" fill="#a855f7"/>
  <polyline points="33,77 36,80 41,73" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="46" y1="77" x2="62" y2="77" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
</svg>
